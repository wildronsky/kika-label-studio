<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>KIKA Label Studio — V5.2</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="app" src="v5.1.html" title="KIKA Label Studio"></iframe><script>const f=document.getElementById('app');f.addEventListener('load',()=>{try{const d=f.contentDocument||f.contentWindow.document;const h=d.querySelector('.header');const wa=h&&h.querySelector('.waHeader');if(wa){const x=d.createElement('div');x.className='socialHeader';x.innerHTML='<div style="font-size:28px;line-height:1;font-weight:900">◎</div><div style="font-size:12px;line-height:1.05;font-weight:950">SEGUICI SU<br>INSTAGRAM</div><strong style="font-size:14px">@KIKA</strong><small style="font-size:9px;color:#686868">Idee, creazioni e novità 💗</small>';x.style.cssText='background:#fff0f7;border-radius:18px;padding:12px 16px;text-align:center;min-width:180px;display:flex;flex-direction:column;align-items:center;gap:3px';wa.replaceWith(x)}const styles=d.createElement('style');styles.textContent='.header{overflow:hidden}.socialHeader{box-shadow:none}.socialHeader strong{display:block}.waHeader{display:none!important}';d.head.appendChild(styles);const sub=[...d.querySelectorAll('.step')].find(e=>e.dataset.step==='5')?.querySelector('.subtitle');if(sub)sub.textContent='Scrivi il nome che vuoi stampare sull’etichetta.';d.title='KIKA Label Studio — V5.2';}catch(e){console.error(e)}});</script></body></html>
